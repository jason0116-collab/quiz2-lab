form.onsubmit=async e=>{e.preventDefault();if(!crypto.subtle){status.textContent='HTTPS 연결을 확인하거나 최신 브라우저로 열어주세요.';return;}button.disabled=true;button.textContent='암호화된 문제은행을 여는 중…';status.textContent='';let raw;try{raw=new TextEncoder().encode(input.value.trim());const material=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);raw.fill(0);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(PAYLOAD.salt),iterations:PAYLOAD.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(PAYLOAD.iv)},key,bytes(PAYLOAD.ct));const html=new TextDecoder().decode(clear);input.value='';document.open();document.write(html);document.close();}catch(error){if(raw)raw.fill(0);status.textContent='비밀번호가 일치하지 않습니다. 대소문자와 하이픈을 확인해 주세요.';button.disabled=false;button.textContent='문제은행 열기 →';input.focus();}};
</script></body></html>
